name: Build and release desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            arch: x64
            bundle: nsis
          - os: macos-15
            platform: mac-arm64
            arch: arm64
            bundle: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate version and architecture
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node tools/validate-release.mjs
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native installer
        run: npm run build:desktop -- --bundles ${{ matrix.bundle }} -- --locked
      - name: Windows native and installed app tests
        if: runner.os == 'Windows'
        run: |
          npm run test:native
          node tools/test-installed.mjs
      - name: Mac packaged startup and persistence smoke
        if: runner.os == 'macOS'
        run: node tools/test-mac.mjs
      - name: Collect installers and checksums
        env:
          BUNDLE: ${{ matrix.bundle }}
          PLATFORM: ${{ matrix.platform }}
        run: node tools/collect-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.dmg dist/*.exe dist/SHA256SUMS.txt --verify-tag --title "持有 $TAG" --notes-file docs/RELEASE_NOTES.md "${flags[@]}"
