name: Build and release desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and architecture
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e 'if(process.arch!=="arm64")throw Error("Expected arm64 runner");if(process.env.REF_TYPE==="tag"&&process.env.REF_NAME!=="v"+require("./package.json").version)throw Error("Tag/version mismatch")'
      - run: npm ci
      - run: npm run test:p1
      - name: Build DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:desktop -- --publish never
      - run: npm run test:packaged
      - name: Checksums
        run: |
          cd dist
          version=$(node -p "require('../package.json').version")
          mv -- *.dmg "Held-Ledger-${version}-arm64.dmg"
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-installer
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and architecture
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: node -e 'if(process.arch!=="x64")throw Error("Expected x64 runner");if(process.env.REF_TYPE==="tag"&&process.env.REF_NAME!=="v"+require("./package.json").version)throw Error("Tag/version mismatch")'
      - run: npm ci
      - run: npm run test:p1
      - name: Build Windows installer
        run: npm run build:windows -- --publish never
      - run: npm run test:packaged
      - run: npm run test:installed
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/*-setup.exe
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.dmg dist/*.exe dist/SHA256SUMS.txt --verify-tag --title "持有 $TAG" --notes-file docs/RELEASE_NOTES.md "${flags[@]}"
