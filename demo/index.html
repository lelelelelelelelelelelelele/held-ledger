<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F3F5F0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="持有" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>持有 · 个人资产台账</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   持有 (Hold) — 个人资产管理 demo
   资产为纲：净资产 + 日均成本双指标 / 生命周期状态 / 消耗刻度尺。
   温润玉绿 + 暖中性纸面。原创设计，借鉴资产管理品类概念，非照搬任何产品。
   ============================================================ */
:root{
  --paper:#F3F5F0;
  --card:#FCFDFA;
  --card-2:#F6F8F2;
  --ink:#1C211D;
  --ink-soft:#3C443E;
  --slate:#5F6960;
  --slate-2:#8A938A;
  --hair:#E2E6DD;
  --hair-2:#EBEEE7;
  --green:#2E7D5B;
  --green-deep:#246349;
  --green-soft:#E6F1EA;
  --green-tint:#EEF5EF;
  --amber:#C77A12;
  --amber-ink:#8A5408;
  --amber-soft:#FBF1E2;
  --idle:#A08C3C;       /* 闲置 */
  --idle-soft:#F4F0DD;
  --sold:#5E7C9A;       /* 已卖出 */
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(28,33,29,.04),0 8px 22px rgba(28,33,29,.06);
  --shadow-soft:0 1px 0 rgba(28,33,29,.03);
  --maxw:430px;
  --tabh:64px;
  --sans:'IBM Plex Sans','Noto Sans SC',system-ui,-apple-system,'PingFang SC',sans-serif;
  --cn:'Noto Sans SC','PingFang SC',system-ui,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans SC',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:#E6EAE2;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
#app{position:relative;max-width:var(--maxw);height:100vh;height:100dvh;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px rgba(28,33,29,.05),0 30px 80px -30px rgba(28,33,29,.25);display:flex;flex-direction:column;overflow:hidden;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
svg{width:20px;height:20px;flex:none;}
.muted{color:var(--slate);}
.pos{color:var(--green);}
.warn{color:var(--amber-ink);}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px;}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:rgba(243,245,240,.86);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--hair);padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;display:flex;align-items:center;gap:10px;min-height:52px;}
.appbar h1{font-size:18px;font-weight:600;margin:0;font-family:var(--cn);letter-spacing:-.01em;}
.appbar .brand{color:var(--green);}
.appbar .sub{font-size:12px;color:var(--slate);margin-left:auto;font-family:var(--cn);}
.appbar .back{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-left:-6px;color:var(--ink);}
.appbar .back svg{width:21px;height:21px;}
.appbar .back:active{background:var(--hair-2);}
.appbar .iconbtn{margin-left:auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--slate);}
.appbar .iconbtn:active{background:var(--hair-2);}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);}
.screen{animation:fade .26s ease both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.section-label{font-family:var(--cn);font-size:12px;font-weight:500;color:var(--slate);letter-spacing:.03em;margin:22px 18px 9px;display:flex;align-items:center;justify-content:space-between;}
.section-label .more{color:var(--green);font-weight:500;}
.block{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow-soft);margin:0 18px;overflow:hidden;}

/* ---------- Net-worth hero (overview) ---------- */
.nethero{margin:14px 18px 0;border-radius:18px;padding:18px 18px 16px;background:linear-gradient(157deg,#E4F1E8 0%,#EFF5EC 52%,#F4F6F0 100%);border:1px solid #D7E6DC;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.nethero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(46,125,91,.10),transparent 70%);}
.nethero .toprow{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.nethero .k{font-family:var(--cn);font-size:12.5px;color:var(--green-deep);display:flex;align-items:center;gap:6px;font-weight:500;}
.valtoggle{font-family:var(--cn);font-size:11.5px;color:var(--green-deep);background:rgba(46,125,91,.10);border:1px solid rgba(46,125,91,.18);padding:3px 10px 3px 11px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;}
.valtoggle svg{width:13px;height:13px;}
.nethero .metrics{display:flex;align-items:flex-end;gap:18px;margin-top:8px;position:relative;z-index:1;}
.nethero .net{flex:1;}
.nethero .net .v{font-family:var(--mono);font-size:33px;font-weight:600;line-height:1.05;color:var(--ink);}
.nethero .net .v .sym{font-size:19px;opacity:.55;margin-right:2px;}
.nethero .daily{text-align:right;flex:none;padding-left:16px;border-left:1px solid rgba(46,125,91,.18);}
.nethero .daily .dk{font-family:var(--cn);font-size:11px;color:var(--slate);}
.nethero .daily .dv{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--green);margin-top:2px;}
.nethero .daily .dv .u{font-size:11px;color:var(--slate);font-family:var(--cn);font-weight:400;}
.nethero .note{font-family:var(--cn);font-size:11px;color:var(--slate);margin-top:4px;position:relative;z-index:1;}

/* status distribution bar */
.statusbar{margin-top:15px;position:relative;z-index:1;}
.statusbar .bar{display:flex;height:9px;border-radius:99px;overflow:hidden;gap:2px;background:rgba(255,255,255,.5);}
.statusbar .bar > i{height:100%;border-radius:2px;}
.statusbar .legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px;}
.statusbar .legend .it{font-family:var(--cn);font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.statusbar .legend .it .d{width:8px;height:8px;border-radius:3px;}
.statusbar .legend .it .n{font-family:var(--mono);color:var(--slate);}

/* ---------- Group breakdown ---------- */
.group-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid var(--hair-2);}
.group-row:first-child{border-top:none;}
.group-row .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--green-tint);border:1px solid var(--hair-2);color:var(--green-deep);}
.group-row .body{flex:1;min-width:0;}
.group-row .nm{font-family:var(--cn);font-size:15px;font-weight:500;}
.group-row .sub{font-family:var(--cn);font-size:11.5px;color:var(--slate);margin-top:2px;}
.group-row .right{text-align:right;flex:none;}
.group-row .val{font-family:var(--mono);font-size:15.5px;font-weight:500;}
.group-row .pct{font-family:var(--mono);font-size:11px;color:var(--slate-2);margin-top:2px;}
.group-row .chev{color:var(--slate-2);margin-left:4px;flex:none;}
.group-row.ph .ic{background:var(--card-2);color:var(--slate-2);}
.group-row.ph .val{color:var(--slate-2);font-family:var(--cn);font-size:13px;}
.group-row:active{background:var(--card-2);}
.sharebar{height:5px;border-radius:99px;background:var(--hair);overflow:hidden;margin-top:8px;}
.sharebar > i{display:block;height:100%;border-radius:99px;background:var(--green);}
.section-label .sec-right{display:flex;align-items:center;gap:10px;}
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 18px;}
.gcard{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:14px 14px 15px;display:flex;flex-direction:column;}
.gcard:active{background:var(--card-2);}
.gcard .top{display:flex;align-items:center;justify-content:space-between;}
.gcard .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--green-tint);border:1px solid var(--hair-2);color:var(--green-deep);}
.gcard .pct{font-family:var(--mono);font-size:11px;color:var(--slate-2);}
.gcard .nm{font-family:var(--cn);font-size:15px;font-weight:500;margin-top:12px;}
.gcard .cnt{font-family:var(--cn);font-size:11.5px;color:var(--slate);margin-top:2px;}
.gcard .val{font-size:18px;font-weight:600;margin-top:10px;letter-spacing:-.01em;}
.gcard .sharebar{margin-top:10px;}
.gcard.ph .ic{background:var(--card-2);color:var(--slate-2);}
.gcard.ph .pct,.gcard.ph .val{color:var(--slate-2);}
.gcard.ph .val{font-family:var(--mono);}
/* ---------- Asset table view ---------- */
.asset-table{margin:0 18px;background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow-soft);overflow:hidden;}
.asset-table .thead,.asset-table .trow{display:grid;grid-template-columns:minmax(0,1fr) 104px 80px;gap:10px;align-items:center;padding:11px 15px;}
.asset-table .thead{background:var(--card-2);border-bottom:1px solid var(--hair);}
.asset-table .thead span{font-family:var(--cn);font-size:11px;font-weight:500;color:var(--slate-2);letter-spacing:.02em;}
.asset-table .thead .r,.asset-table .cell{text-align:right;}
.asset-table .trow{border-top:1px solid var(--hair-2);}
.asset-table .trow:active{background:var(--card-2);}
.asset-table .trow.faded{opacity:.5;}
.asset-table .nm{display:flex;align-items:center;gap:8px;min-width:0;}
.asset-table .nm .dot{width:7px;height:7px;border-radius:99px;flex:none;}
.asset-table .nm .t{font-family:var(--cn);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-table .cell{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;}
.asset-table .cell.muted{color:var(--slate-2);}
/* ---------- Card grid view (有数 photo cards) ---------- */
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 18px;}
.gcell{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
.gcell:active{transform:scale(.99);}
.gcell.faded{opacity:.6;}
.gcell .ph{position:relative;aspect-ratio:16/10;background:var(--card-2);display:grid;place-items:center;}
.gcell .ph.photo{background-size:cover;background-position:center;}
.gcell .ph > svg{width:38px;height:38px;color:var(--slate-2);opacity:.55;}
.gcell .gpill{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.93);border-radius:99px;padding:3px 8px;font-family:var(--cn);font-size:11px;font-weight:500;color:var(--ink-soft);box-shadow:0 1px 3px rgba(28,33,29,.12);}
.gcell .gpill i{width:5px;height:5px;border-radius:99px;flex:none;}
.gcell .ginfo{padding:11px 12px 13px;display:flex;flex-direction:column;flex:1;}
.gcell .gnm{font-family:var(--cn);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gcell .gsub{font-family:var(--cn);font-size:11px;color:var(--slate-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gcell .gcost{font-family:var(--mono);font-size:12px;color:var(--green);margin-top:9px;letter-spacing:-.01em;display:flex;align-items:baseline;}
.gcell .gcost b{font-size:21px;font-weight:600;line-height:1;}
.gcell .gcost .u{font-size:11px;color:var(--slate-2);font-weight:500;margin-left:2px;}
.gcell .gcost.cash{color:var(--ink);}
.gcell .gcost.sold{color:var(--sold);}
.gcell .gcost.retired{color:var(--slate);font-family:var(--cn);}
.gcell .gcost.retired b{font-size:15px;}
.gcell .spark{width:62%;height:21px;margin-top:8px;color:var(--green);opacity:.85;}
.gcell .spark path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke;}
.gcell .gfoot{font-family:var(--cn);font-size:11px;color:var(--slate-2);margin-top:8px;}

/* ---------- Depletion ruler (signature) ---------- */
.ruler{margin-top:9px;}
.ruler .scale{position:relative;height:16px;display:flex;align-items:stretch;gap:3px;}
.ruler.discrete .tick{flex:1;border-radius:4px;background:var(--hair);}
.ruler.discrete .tick.left{background:var(--green);}
.ruler.discrete .tick.used{background:repeating-linear-gradient(-45deg,var(--hair) 0 4px,var(--hair-2) 4px 8px);}
.ruler.cont .scale{display:block;height:16px;border-radius:6px;background:repeating-linear-gradient(-45deg,#E9EDE4 0 5px,#E3E8DD 5px 10px);overflow:hidden;}
.ruler.cont .scale > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3C9670,var(--green));}
.ruler.time .scale{display:block;height:7px;border-radius:99px;background:var(--hair);overflow:visible;position:relative;}
.ruler.time .scale > i{display:block;height:100%;border-radius:99px;background:var(--green);}
.ruler.time .scale > i.warn{background:var(--amber);}
.ruler.time .pin{position:absolute;top:-4px;width:2px;height:15px;border-radius:2px;background:var(--ink);}
.ruler .legend{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--slate);}
.ruler .legend .hi{color:var(--ink);font-weight:500;}
.ruler .legend .hi.warn{color:var(--amber-ink);}

/* ---------- Status pill ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--cn);font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--card-2);color:var(--slate);border:1px solid var(--hair);white-space:nowrap;}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.active{background:var(--green-soft);color:var(--green-deep);border-color:#CDE6D7;}
.pill.idle{background:var(--idle-soft);color:var(--idle);border-color:#ECE4C5;}
.pill.expiring{background:var(--amber-soft);color:var(--amber-ink);border-color:#F0DEC0;}
.pill.retired{background:var(--card-2);color:var(--slate-2);border-color:var(--hair);}
.pill.sold{background:#EAEFF4;color:var(--sold);border-color:#D5E0EA;}
.pill.mono{font-family:var(--mono);}

/* daily-cost capsule */
.dcap{display:inline-flex;align-items:baseline;gap:1px;font-family:var(--mono);font-weight:600;color:var(--green);}
.dcap .u{font-size:11px;color:var(--slate);font-weight:400;font-family:var(--cn);margin-left:1px;}

/* ---------- Reminder / todo ---------- */
.remind{padding:13px 16px;border-top:1px solid var(--hair-2);}
.remind:first-child{border-top:none;}
.remind .head{display:flex;align-items:center;gap:11px;}
.remind .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);border:1px solid #F0DEC0;}
.remind .ic svg{width:18px;height:18px;}
.remind .nm{font-family:var(--cn);font-size:14px;font-weight:500;flex:1;}
.remind .meta{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:1px;}
.remind:active{background:var(--card-2);}

/* ---------- Item card (assets list) ---------- */
.cat-tabs{display:flex;gap:18px;padding:12px 18px 2px;overflow-x:auto;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{font-family:var(--cn);font-size:14px;color:var(--slate);white-space:nowrap;padding-bottom:8px;border-bottom:2px solid transparent;flex:none;}
.cat-tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--green);}
.chips{display:flex;gap:7px;padding:10px 18px 4px;overflow-x:auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{font-family:var(--cn);font-size:12.5px;color:var(--slate);background:var(--card);border:1px solid var(--hair);border-radius:99px;padding:5px 13px;white-space:nowrap;flex:none;}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.items{padding:6px 18px 0;display:flex;flex-direction:column;gap:10px;}
.icard{display:flex;gap:13px;padding:13px;background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow-soft);align-items:center;}
.icard:active{background:var(--card-2);}
.thumb{flex:none;width:54px;height:54px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--hair-2);}
.thumb svg{width:26px;height:26px;color:var(--ink-soft);opacity:.9;}
.icard .body{flex:1;min-width:0;}
.icard .nm{font-family:var(--cn);font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icard .sub{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:3px;}
.icard .ruler{margin-top:8px;}
.icard .right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.icard .big{font-family:var(--mono);font-size:17px;font-weight:600;}
.icard .dcap{font-size:16px;}
.faded{opacity:.62;}

/* ---------- Asset detail ---------- */
.dhero{margin:14px 18px 0;background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:20px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;}
.dhero .thumb{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;}
.dhero.has-photo{padding-top:0;}
.dhero-photo{margin:-20px -20px 16px;height:200px;background-size:cover;background-position:center;background-color:var(--card-2);}
.dhero .thumb svg{width:40px;height:40px;}
.dhero .nm{font-family:var(--cn);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;}
.dhero .dailybig{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--green);margin-top:10px;}
.dhero .dailybig .u{font-size:14px;color:var(--slate);font-family:var(--cn);font-weight:400;}
.dhero .line{font-family:var(--mono);font-size:12.5px;color:var(--slate);margin-top:6px;}
.dhero .bal{font-family:var(--mono);font-size:32px;font-weight:600;margin-top:8px;}
.dhero .bal .sym{font-size:18px;opacity:.55;}
.dhero .ruler{margin-top:16px;text-align:left;}
.detail-actions{display:flex;gap:10px;margin:12px 18px 0;flex-wrap:wrap;}
.detail-actions button{flex:1;min-width:calc(50% - 5px);font-family:var(--cn);font-size:14px;font-weight:500;padding:12px 0;border-radius:12px;border:1px solid var(--hair);background:var(--card);box-shadow:var(--shadow-soft);}
.detail-actions button.primary{background:var(--green);color:#fff;border-color:var(--green);}
.detail-actions button:active{transform:scale(.985);}
.detail-actions button:disabled{opacity:.4;}
.photo-row{margin:10px 18px 0;}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;font-family:var(--cn);font-size:14px;font-weight:500;color:var(--slate);padding:11px 0;border-radius:12px;border:1px dashed var(--hair);background:var(--card-2);}
.photo-btn svg{width:18px;height:18px;}
.photo-btn:active{transform:scale(.985);}
.metarow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--hair-2);font-family:var(--cn);font-size:14px;}
.metarow:first-child{border-top:none;}
.metarow .mk{color:var(--slate);}
.metarow .mv{font-family:var(--mono);font-size:13.5px;color:var(--ink);text-align:right;}
.metarow .mv.cn{font-family:var(--cn);}
.timeline{padding:4px 16px;}
.tlrow{display:flex;gap:13px;padding:11px 0;}
.tlrow .rail{flex:none;width:12px;display:flex;flex-direction:column;align-items:center;}
.tlrow .rail .dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-top:5px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--hair);}
.tlrow .rail .dot.spent{background:var(--slate-2);}
.tlrow .rail .line{flex:1;width:2px;background:var(--hair);margin-top:3px;}
.tlrow:last-child .rail .line{display:none;}
.tlrow .c{flex:1;}
.tlrow .c .t1{font-family:var(--cn);font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:8px;}
.tlrow .c .t1 .delta{font-family:var(--mono);font-size:13px;color:var(--slate);font-weight:400;}
.tlrow .c .t1 .delta.down{color:var(--amber-ink);}
.tlrow .c .t1 .delta.up{color:var(--green);}
.tlrow .c .t2{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:2px;}

/* inline edit */
.editbar{display:flex;gap:10px;margin:12px 18px 0;}
.editbar input{flex:1;font-family:var(--mono);font-size:17px;border:1px solid var(--hair);border-radius:11px;padding:11px 13px;background:var(--card);outline:none;color:var(--ink);}
.editbar input:focus{border-color:var(--green);}
.editbar .ok{font-family:var(--cn);font-weight:600;font-size:14px;color:#fff;background:var(--green);border-radius:11px;padding:0 18px;}
.editbar .cancel{font-family:var(--cn);font-size:14px;color:var(--slate);padding:0 6px;}

/* ---------- Action screen ---------- */
.action-hero{display:flex;gap:12px;margin:16px 18px 0;}
.action-hero button{flex:1;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:17px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:11px;box-shadow:var(--shadow-soft);}
.action-hero button .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--green);color:#fff;}
.action-hero button.alt .ic{background:var(--ink);}
.action-hero button .t{font-family:var(--cn);font-size:15px;font-weight:600;}
.action-hero button .d{font-family:var(--cn);font-size:11.5px;color:var(--slate);text-align:left;}
.action-hero button:active{transform:scale(.99);}
.tmpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:4px 18px;}
.tmpl{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;border-radius:13px;border:1px solid var(--hair);background:var(--card);}
.tmpl:active{background:var(--card-2);}
.tmpl .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--green-tint);color:var(--green-deep);border:1px solid var(--hair-2);}
.tmpl .l{font-family:var(--cn);font-size:11.5px;color:var(--ink-soft);}

/* ---------- Empty / invest placeholder ---------- */
.empty{text-align:center;color:var(--slate);font-family:var(--cn);font-size:13.5px;padding:40px 24px;}
.empty-big{text-align:center;padding:56px 30px;}
.empty-big .ic{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;margin:0 auto 16px;background:var(--green-tint);border:1px solid var(--hair-2);color:var(--green-deep);}
.empty-big .ic svg{width:30px;height:30px;}
.empty-big .t{font-family:var(--cn);font-size:17px;font-weight:600;}
.empty-big .d{font-family:var(--cn);font-size:13px;color:var(--slate);margin-top:9px;line-height:1.65;}
.empty-big .cta{display:inline-block;margin-top:18px;font-family:var(--cn);font-size:13.5px;color:#fff;background:var(--green);border-radius:11px;padding:10px 20px;font-weight:500;}

/* ---------- Me ---------- */
.me-id{display:flex;align-items:center;gap:14px;margin:16px 18px 0;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;box-shadow:var(--shadow-soft);}
.me-id .av{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--cn);font-weight:600;}
.me-id .nm{font-family:var(--cn);font-size:16px;font-weight:600;}
.me-id .em{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:2px;}
.me-row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-top:1px solid var(--hair-2);font-family:var(--cn);}
.me-row:first-child{border-top:none;}
.me-row .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--green-tint);border:1px solid var(--hair-2);color:var(--green-deep);}
.me-row .ic svg{width:17px;height:17px;}
.me-row .t{flex:1;font-size:14.5px;font-weight:500;}
.me-row .v{font-family:var(--mono);font-size:13px;color:var(--slate);}
.me-row .seg2{display:flex;background:var(--hair);border-radius:9px;padding:2px;}
.me-row .seg2 button{font-family:var(--cn);font-size:12px;padding:5px 11px;border-radius:7px;color:var(--slate);}
.me-row .seg2 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-soft);font-weight:500;}

/* ---------- Smart add (NL) + BYOK ---------- */
.nl-ta{width:100%;min-height:52px;resize:none;border:1px solid var(--hair);border-radius:11px;padding:11px 12px;font-family:var(--cn);font-size:14px;background:var(--card-2);outline:none;color:var(--ink);line-height:1.5;}
.nl-ta:focus{border-color:var(--green);}
.nl-go{font-family:var(--cn);font-weight:600;font-size:14px;color:#fff;background:var(--green);border-radius:11px;padding:11px 0;}
.nl-go:active{transform:scale(.99);}
.nl-cancel{font-family:var(--cn);font-size:14px;color:var(--slate);background:var(--card-2);border:1px solid var(--hair);border-radius:11px;padding:11px 16px;}
.nl-err{font-family:var(--cn);font-size:12px;color:var(--amber-ink);margin-top:9px;background:var(--amber-soft);border:1px solid #F0DEC0;border-radius:9px;padding:8px 10px;line-height:1.5;}
.nl-preview{margin-top:12px;border-top:1px dashed var(--hair);padding-top:11px;}
.nl-row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--cn);font-size:13.5px;padding:5px 0;}
.nl-row span{color:var(--slate);}
.nl-row b{font-family:var(--mono);font-weight:600;color:var(--ink);}
.nl-row.src{color:var(--slate-2);font-size:11.5px;justify-content:flex-start;gap:5px;}
.byok-note{font-family:var(--cn);font-size:12.5px;color:var(--slate);line-height:1.65;margin-bottom:12px;}
.byok-l{font-family:var(--cn);font-size:12px;color:var(--slate);display:block;margin:9px 0 5px;}
.byok-in{width:100%;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:13px;background:var(--card-2);outline:none;color:var(--ink);}
.byok-in:focus{border-color:var(--green);}
.byok-warn{font-family:var(--cn);font-size:11px;color:var(--amber-ink);background:var(--amber-soft);border:1px solid #F0DEC0;border-radius:9px;padding:9px 11px;margin-top:12px;line-height:1.65;}
.nl-cam{font-family:var(--cn);font-size:14px;color:var(--green-deep);background:var(--green-tint);border:1px solid #CDE6D7;border-radius:11px;padding:0 14px;display:flex;align-items:center;gap:6px;flex:none;}
.nl-cam svg{width:18px;height:18px;}
.nl-img{margin-top:9px;display:flex;align-items:center;gap:10px;font-family:var(--cn);font-size:12px;color:var(--slate);}
.nl-img img{width:54px;height:54px;border-radius:10px;object-fit:cover;border:1px solid var(--hair);}
.thumb.photo svg{display:none;}

/* ---------- Tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(252,253,250,.9);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:space-around;}
.tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--slate);}
.tab svg{width:23px;height:23px;}
.tab .tl{font-family:var(--cn);font-size:10.5px;}
.tab.on{color:var(--green);}
.tab.on .tl{font-weight:500;}
.tab.add{flex:none;width:58px;}
.tab.add .plus{width:46px;height:46px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(46,125,91,.5);margin-bottom:2px;transition:.12s;}
.tab.add:active .plus{transform:translateY(1px) scale(.96);}
.tab.add svg{width:26px;height:26px;}

/* ---------- Stamp ---------- */
.stamp-host{position:absolute;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;}
.stamp{font-family:var(--cn);font-weight:700;font-size:20px;letter-spacing:.16em;color:var(--green-deep);border:2.5px solid var(--green);border-radius:12px;padding:12px 22px;background:rgba(230,241,234,.82);transform:rotate(-8deg) scale(1.2);opacity:0;box-shadow:inset 0 0 0 1px rgba(46,125,91,.22);}
.stamp.go{animation:stampin .5s cubic-bezier(.2,.9,.3,1.2) forwards;}
@keyframes stampin{0%{opacity:0;transform:rotate(-8deg) scale(1.32);}38%{opacity:1;transform:rotate(-8deg) scale(.96);}100%{opacity:1;transform:rotate(-8deg) scale(1);}}
.stamp.out{transition:opacity .4s ease .5s;opacity:0;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ---------- Rich card view (卡片视图) ---------- */
.view-toggle{display:flex;gap:4px;margin-left:auto;}
.view-toggle button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--slate);background:transparent;border:1px solid transparent;}
.view-toggle button.on{background:var(--card);border-color:var(--hair);color:var(--ink);box-shadow:var(--shadow-soft);}
.view-toggle button svg{width:16px;height:16px;}
.rcard{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 18px 12px;padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.rcard:active{background:var(--card-2);}
.rcard.faded{opacity:.6;}
.rcard-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.rcard-top .ric{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--hair-2);flex:none;}
.rcard-top .ric svg{width:22px;height:22px;color:var(--ink-soft);opacity:.9;}
.rcard-top .rinfo{flex:1;min-width:0;}
.rcard-top .rname{font-family:var(--cn);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.rcard-top .rtag{font-family:var(--cn);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card-2);color:var(--slate);border:1px solid var(--hair);}
.rcard-metrics{display:flex;gap:0;margin-bottom:12px;}
.rcard-metric{flex:1;padding:10px 14px;background:var(--green-tint);border:1px solid #CDE6D7;border-radius:var(--radius-sm);}
.rcard-metric:first-child{border-right:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);}
.rcard-metric:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.rcard-metric .rk{font-family:var(--cn);font-size:11.5px;color:var(--slate);margin-bottom:4px;}
.rcard-metric .rv{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--green);}
.rcard-metric .rv .ru{font-size:11px;color:var(--slate);font-weight:400;font-family:var(--cn);margin-left:2px;}
.rcard-story{font-family:var(--cn);font-size:12.5px;color:var(--slate);line-height:1.7;padding:10px 14px;background:var(--card-2);border-radius:var(--radius-sm);border:1px solid var(--hair-2);}
.rcard-story b{color:var(--ink);font-weight:500;}
.rcard-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.rcard-bottom .rl{font-family:var(--mono);font-size:11px;color:var(--slate-2);}
.rcard-bottom .rr{display:flex;gap:6px;}
.rcard-bottom .rr button{font-family:var(--cn);font-size:11.5px;padding:4px 10px;border-radius:8px;background:var(--card);border:1px solid var(--hair);color:var(--slate);}
.rcard-bottom .rr button:active{background:var(--card-2);}
.rcard-bottom .rr button.primary{background:var(--green);color:#fff;border-color:var(--green);}
</style>

/* ---------- IndexedDB 持久化层 ---------- */
const DB_NAME='youshu_ledger_seeded_v4';
const DB_VER=1;
const STORE='assets';
function openDB(){return new Promise((ok,fail)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=e=>ok(e.target.result);r.onerror=e=>fail(e.target.error);});}
async function dbGetAll(){const db=await openDB();return new Promise((ok,fail)=>{const tx=db.transaction(STORE,'readonly');const st=tx.objectStore(STORE);const req=getAll_compat(st);req.onsuccess=e=>ok(e.target.result);req.onerror=e=>fail(e.target.error);});}
async function dbPutAll(assets){const db=await openDB();return new Promise((ok,fail)=>{const tx=db.transaction(STORE,'readwrite');const st=tx.objectStore(STORE);st.clear();assets.forEach(a=>st.put(a));tx.oncomplete=()=>ok();tx.onerror=e=>fail(e.target.error);});}
/* getAll 兼容（Safari 早期版本不支持 IDBObjectStore.getAll） */
function getAll_compat(store){if(store.getAll)return store.getAll();return new Promise((ok,fail)=>{const r=store.openCursor();const out=[];r.onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else ok(out);};r.onerror=e=>fail(e.target.error);});}

/* 500ms 防抖写入（借鉴 Focus Flow） */
let _saveTimer=null;
function debouncedSave(){
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>dbPutAll(ASSETS).catch(e=>console.warn('[DB] save failed',e)),500);
}

/* groups */

  {id:'financial',name:'金融资产',icon:'bank',sub:'现金 · 存款 · 投资理财'},
  {id:'physical',name:'实物资产',icon:'box',sub:'数码 · 家居 · 交通'},

/* ---------- helpers ---------- */
function money(n,o){o=o||{};const neg=n<0;let v=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:o.cents===false?0:2,maximumFractionDigits:o.cents===false?0:2});let s=(o.sym!==false?'¥':'')+v;if(o.sign)s=(neg?'−':'+')+s;else if(neg)s='−'+s;return s;}
function parseDate(d){const[y,m,da]=d.split('-').map(Number);return new Date(y,m-1,da);}
function daysBetween(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000);}
function addYears(d,n){const[y,m,da]=d.split('-').map(Number);return (y+n)+'-'+String(m).padStart(2,'0')+'-'+String(da).padStart(2,'0');}
function mdLabel(d){const[,m,da]=d.split('-');return parseInt(m)+'月'+parseInt(da)+'日';}
function daysHeld(a){return a.bought?Math.max(1,daysBetween(a.bought,TODAY)):0;}
function dailyCost(a){return (a.price&&a.bought)?a.price/daysHeld(a):0;}
function heldText(a){const d=daysHeld(a);if(d>=365){return (d/365).toFixed(1)+' 年';}return d+' 天';}
function cloneAssets(assets){return assets.map(a=>JSON.parse(JSON.stringify(a)));}

/* ---------- 缩略图流程：上传 → 居中裁切缩放 → 存储 → 展示 ---------- */
// 把任意图片 dataURL 压成方形缩略图（默认 360px、JPEG），减小 IndexedDB 体积。
function makeThumb(src,size){
  size=size||360;
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const s=Math.min(img.width,img.height);
        const sx=(img.width-s)/2, sy=(img.height-s)/2;
        const cv=document.createElement('canvas');cv.width=size;cv.height=size;
        const ctx=cv.getContext('2d');
        ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
        resolve(cv.toDataURL('image/jpeg',0.82));
      }catch(e){resolve(src);} // 跨域/解码失败时回退原图
    };
    img.onerror=()=>resolve(src);
    img.src=src;
  });
}
// 调亮/调暗一个 #rrggbb 颜色
function shade(hex,amt){const n=parseInt(hex.replace('#',''),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;const cl=x=>Math.max(0,Math.min(255,x));return '#'+(0x1000000+(cl(r)<<16)+(cl(g)<<8)+cl(b)).toString(16).slice(1);}
// 没有真实照片时，按资产色调 + 图标生成一张占位缩略图（data-URI SVG）
function svgThumb(a){
  const base=a.tint||'#DDE6DD', mid=shade(base,-48), deep=shade(base,-88), glyph=ICON[a.icon]||'';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+mid+'"/><stop offset="1" stop-color="'+deep+'"/></linearGradient>'+
    '<radialGradient id="h" cx="0.3" cy="0.24" r="0.95"><stop offset="0" stop-color="#fff" stop-opacity="0.3"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>'+
    '<rect width="120" height="90" fill="url(#g)"/><rect width="120" height="90" fill="url(#h)"/>'+
    '<g transform="translate(60 45) scale(2.1) translate(-12 -12)" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+glyph+'</g></svg>';
  // encodeURIComponent leaves ()  raw — they break the unquoted CSS url(...) token, so encode them too
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg).replace(/\(/g,'%28').replace(/\)/g,'%29');
}
// 启动后：给没有真实照片的实物/权益资产补一张生成缩略图（仅内存，不写库）
function ensureThumbs(){ASSETS.forEach(a=>{if(a.group!=='cash'&&!a.photo)a.photo=svgThumb(a);});}

function groupAssets(gid){
  if(gid==='financial')return ASSETS.filter(a=>(a.group==='cash'||a.group==='financial'||a.group==='invest')&&a.countable);
  if(gid==='member')return ASSETS.filter(a=>isMemberAsset(a)&&a.countable);
  if(gid==='entitle')return ASSETS.filter(a=>a.group==='entitle'&&!isMemberAsset(a)&&a.countable);
  return ASSETS.filter(a=>a.group===gid&&a.countable);
}
function groupValue(gid){return groupAssets(gid).reduce((s,a)=>s+a.value,0);}

function netWorth(){if(S.valueMode==='cashOnly')return cashValue();return ASSETS.filter(a=>a.countable).reduce((s,a)=>s+a.value,0);}
function pctOf(v,total){return total>0?Math.round(v/total*100):0;}
function nonCashValue(){return netWorth()-cashValue()+ (S.valueMode==='cashOnly'? (ASSETS.filter(a=>a.countable&&a.group!=='cash').reduce((s,a)=>s+a.value,0)) :0);}

function statusCounts(){const c={active:0,idle:0,retired:0,sold:0};physItems().forEach(a=>{c[a.status]=(c[a.status]||0)+1;});return c;}
function isExpiring(a){if(!a.validUntil)return false;const n=daysBetween(TODAY,a.validUntil);return n>=0&&n<=30;}
function todos(){
  const list=[];
  ASSETS.forEach(a=>{
    if(a.validUntil){const n=daysBetween(TODAY,a.validUntil);if(n>=0&&n<=60)list.push({a,label:'有效期',date:a.validUntil,days:n});}
    if(a.due)a.due.forEach(d=>{const n=daysBetween(TODAY,d.date);if(n>=0&&n<=60)list.push({a,label:d.label,date:d.date,days:n});});
  });
  return list.sort((x,y)=>x.days-y.days);
}

/* depletion ruler */
function rulerHTML(a,full){
  const m=a.meter;if(!m)return '';
  if(m.type==='discrete'){let t='';for(let i=0;i<m.total;i++)t+='<div class="tick '+(i<m.remaining?'left':'used')+'"></div>';
    const lg=full?'<div class="legend"><span>已用 '+(m.total-m.remaining)+' · 共 '+m.total+' '+a.unitName+'</span><span class="hi'+(isExpiring(a)?' warn':'')+'">剩余 '+m.remaining+' '+a.unitName+'</span></div>':'';
    return '<div class="ruler discrete"><div class="scale">'+t+'</div>'+lg+'</div>';}
  if(m.type==='cont'){const p=Math.max(2,Math.round(m.remaining/m.total*100));
    const lg=full?'<div class="legend"><span>面值 '+money(m.total)+'</span><span class="hi'+(isExpiring(a)?' warn':'')+'">剩余 '+money(m.remaining)+'</span></div>':'';
    return '<div class="ruler cont"><div class="scale"><i style="width:'+p+'%"></i></div>'+lg+'</div>';}
  if(m.type==='time'){const tot=daysBetween(m.start,m.end),pa=daysBetween(m.start,TODAY),p=Math.max(2,Math.min(100,Math.round(pa/tot*100))),left=daysBetween(TODAY,m.end),w=left<=30;
    const lg=full?'<div class="legend"><span>'+m.label+' '+m.end+'</span><span class="hi'+(w?' warn':'')+'">'+(left<0?'已过期':'剩余 '+left+' 天')+'</span></div>':'';
    return '<div class="ruler time"><div class="scale"><i class="'+(w?'warn':'')+'" style="width:'+p+'%"></i><span class="pin" style="left:'+p+'%"></span></div>'+lg+'</div>';}
  return '';
}
function statusPill(a){
  const st=isExpiring(a)&&(a.status==='active')&&a.validUntil?{label:'临期',cls:'expiring'}:{label:STATUS[a.status].label,cls:a.status};
  return '<span class="pill '+st.cls+'"><span class="dot"></span>'+st.label+'</span>';
}
function entitleTotal(a){
  if(a.mileage&&a.mileage.total)return Number(a.mileage.total).toLocaleString('en-US');
  if(a.meter&&a.meter.type==='discrete')return Number(a.meter.remaining||0).toLocaleString('en-US');
  return '';
}
function isEntitleLike(a){return a.group==='entitle'||isMemberAsset(a);}
function entitleUnit(a){return (a.mileage&&'里程')||a.unitName||'权益';}
function entitleSub(a){
  if(a.mileage){
    if(a.mileage.rollingMonths)return '滚动 '+a.mileage.rollingMonths+' 个月';
    if(a.mileage.expiringSoonDate)return '首批到期 '+a.mileage.expiringSoonDate;
  }
  if(a.unitName==='会员'||/会员/.test(a.name))return a.validUntil?'到期 '+a.validUntil:'会员权益';
  if(a.validUntil)return '有效期 '+a.validUntil;
  return a.cat||'权益';
}
function entitleFoot(a){
  if(a.mileage){
    if(a.value>0)return '估值 '+money(a.value);
    if(a.mileage.remainingExpiry)return '余量至 '+a.mileage.remainingExpiry;
    if(a.mileage.lastUpdate)return '上次更新 '+a.mileage.lastUpdate;
  }
  if(a.unitName==='会员'||/会员/.test(a.name))return '会员';
  return '折算价值 '+money(a.value);
}
function entitleMilesTotal(){
  return ASSETS.filter(a=>a.group==='entitle'&&a.mileage).reduce((s,a)=>s+Number(a.mileage.total||0),0);
}
function groupSubText(gid,cnt,pct){
  if(gid==='entitle'){
    const miles=entitleMilesTotal();
    return cnt+' 项 · '+(miles?miles.toLocaleString('en-US')+' 里程':'权益记录');
  }
  if(gid==='member')return cnt+' 项 · 到期提醒';
  if(gid==='financial')return cnt+' 项 · 占 '+pct+'%';
  return cnt+' 项 · 占 '+pct+'%';
}
function groupValueText(gid,v){
  if(gid==='member')return groupAssets('member').length+' 项';
  if(gid==='entitle'){
    const miles=entitleMilesTotal();
    return v>0?money(v):(miles?miles.toLocaleString('en-US')+' 里程':money(v));
  }
  return money(v);
}
function groupPctText(gid,pct,v){
  if(gid==='entitle')return v>0?'估值':'权益';
  if(gid==='member')return '会员';
  return '占 '+pct+'%';
}

function viewAssets(){

  const states=['全部','服役中','闲置','临期','已退役','已卖出'];
  const catTabs=cats.map(c=>'<button class="cat-tab'+(S.cat===c?' on':'')+'" data-act="cat" data-arg="'+c+'">'+c+'</button>').join('');
  const chips=states.map(s=>'<button class="chip'+(S.status===s?' on':'')+'" data-act="status" data-arg="'+s+'">'+s+'</button>').join('');
  const toggle='<div class="view-toggle"><button class="'+(S.viewMode==='table'?'on':'')+'" data-act="viewmode" data-arg="table" aria-label="表格视图">'+svg('table')+'</button><button class="'+(S.viewMode==='list'?'on':'')+'" data-act="viewmode" data-arg="list" aria-label="列表视图">'+svg('list')+'</button><button class="'+(S.viewMode==='card'?'on':'')+'" data-act="viewmode" data-arg="card" aria-label="卡片视图">'+svg('grid2')+'</button></div>';
  setScreen('<div class="cat-tabs">'+catTabs+toggle+'</div><div class="chips">'+chips+'</div><div id="itemList">'+itemsHTML()+'</div><div style="height:8px"></div>');
}
function itemsHTML(){
  let list=ASSETS.slice();
  if(!list.length)return '<div class="empty-big"><div class="ic">'+svg('box')+'</div><div class="t">还没有资产</div><div class="d">先添加一件实物、一个账户或一张权益卡券。</div><a class="cta" data-act="nav" data-arg="action" role="button" tabindex="0">去添加</a></div>';
  if(S.cat!=='全部')list=list.filter(a=>a.cat===S.cat);
  if(S.status!=='全部'){const map={'服役中':'active','闲置':'idle','已退役':'retired','已卖出':'sold'};
    if(S.status==='临期')list=list.filter(a=>isExpiring(a));else list=list.filter(a=>a.status===map[S.status]);}
  // order: active/idle/expiring first, retired/sold last
  const rank={active:0,idle:1,retired:3,sold:4};
  list.sort((a,b)=>(rank[a.status])-(rank[b.status]));
  if(!list.length)return '<div class="empty">没有符合条件的资产</div>';
  if(S.viewMode==='card')return '<div class="card-grid">'+list.map(gridCard).join('')+'</div>';
  if(S.viewMode==='table')return assetTable(list);
  return '<div class="items">'+list.map(itemCard).join('')+'</div>';
}
/* 表格视图：每一项资产一行，资产 / 数值 / 日均 三列对齐 */
function assetTable(list){
  const head='<div class="thead"><span>资产</span><span class="r">数值</span><span class="r">日均</span></div>';
  const rows=list.map(a=>{
    const faded=(a.status==='retired'||a.status==='sold')?' faded':'';
    const net=isEntitleLike(a)&&entitleTotal(a)?entitleTotal(a)+' '+entitleUnit(a):money(a.status==='sold'?(a.soldPrice||0):a.value,{cents:false});
    const hasDaily=a.group==='physical'&&(a.status==='active'||a.status==='idle');
    const daily=hasDaily?('¥'+dailyCost(a).toFixed(2)):'—';
    return '<div class="trow'+faded+'" data-act="asset" data-arg="'+a.id+'" role="button" tabindex="0" aria-label="'+a.name+'，'+STATUS[a.status].label+'">'+
      '<div class="nm"><span class="dot" style="background:'+STATUS[a.status].color+'"></span><span class="t">'+a.name+'</span></div>'+
      '<div class="cell">'+net+'</div>'+
      '<div class="cell'+(hasDaily?'':' muted')+'">'+daily+'</div></div>';
  }).join('');
  return '<div class="asset-table">'+head+rows+'</div>';
}
function itemCard(a){
  const faded=(a.status==='retired'||a.status==='sold')?' faded':'';
  let right='';
  if(a.group==='cash'){right='<div class="big num">'+money(a.value)+'</div>'+statusPill(a);}
  else if(isEntitleLike(a)){right=statusPill(a);}
  else{ // physical durable
    if(a.status==='sold')right='<div class="big num" style="color:var(--sold)">'+money(a.soldPrice)+'</div>'+statusPill(a);
    else if(a.status==='retired')right=statusPill(a);
    else right='<div class="dcap">¥'+dailyCost(a).toFixed(2)+'<span class="u">/天</span></div>'+statusPill(a);
  }
  let sub='';
  if(a.group==='cash')sub=a.meta&&a.meta[0]?a.meta[0][1]:'账户';
  else if(isEntitleLike(a))sub=entitleSub(a);
  else sub='总价 '+money(a.price,{cents:false})+' · 已持有 '+heldText(a);
  const ruler=isEntitleLike(a)?rulerHTML(a,false):'';
  return '<div class="icard'+faded+'" data-act="asset" data-arg="'+a.id+'" role="button" tabindex="0" aria-label="'+a.name+'，'+STATUS[a.status].label+'">'+
    '<div class="thumb'+(a.photo?' photo':'')+'" style="'+(a.photo?'background-image:url('+a.photo+');background-size:cover;background-position:center':'background:'+a.tint)+'">'+(a.photo?'':svg(a.icon))+'</div>'+
    '<div class="body"><div class="nm">'+a.name+'</div><div class="sub">'+sub+'</div>'+ruler+'</div>'+
    '<div class="right">'+right+'</div></div>';
}
/* 预计服役年限（按类别），用于卡片「剩余 N 天」 */
const LIFE_YEARS={数码:8,家居:15,交通:15};
function serviceLeft(a){const ly=LIFE_YEARS[a.cat]||10;return Math.max(0,Math.round(ly*365-daysHeld(a)));}
/* 卡片视图：有数风格照片卡（两列网格）
   照片 + 状态角标 + 名称 + 原价·已用天数 + 醒目日均成本 + 衰减曲线 + 剩余天数 */
function gridCard(a){
  const faded=(a.status==='retired'||a.status==='sold')?' faded':'';
  const ph='<div class="ph'+(a.photo?' photo':'')+'" style="'+(a.photo?'background-image:url('+a.photo+')':'background:'+(a.tint||'var(--card-2)'))+'">'+(a.photo?'':svg(a.icon))+
    '<span class="gpill"><i style="background:'+STATUS[a.status].color+'"></i>'+STATUS[a.status].label+'</span></div>';
  let sub='',hero='',heroCls='',foot='';
  if(a.group==='cash'){
    sub=a.meta&&a.meta[0]?a.meta[0][1]:'账户';
    hero='¥<b>'+money(a.value,{cents:false,sym:false})+'</b>';heroCls=' cash';foot='当前余额';
  }else if(isEntitleLike(a)){
    sub=entitleSub(a);
    if(a.mileage){
      hero='<b>'+entitleTotal(a)+'</b><span class="u">'+entitleUnit(a)+'</span>';
      heroCls=' cash';foot=entitleFoot(a);
    }else if(a.unitName==='会员'||/会员/.test(a.name)){
      hero='<b>会员</b>';
      heroCls=' cash';foot=entitleFoot(a);
    }else{
      hero='¥<b>'+money(a.value,{cents:false,sym:false})+'</b>';
      heroCls=' cash';foot='折算价值 '+money(a.value);
    }
  }else if(a.status==='sold'){
    sub='持有 '+heldText(a);
    hero='¥<b>'+money(a.soldPrice||0,{cents:false,sym:false})+'</b>';heroCls=' sold';
    foot='折旧 '+money((a.soldPrice||0)-(a.price||0),{sign:true,cents:false});
  }else if(a.status==='retired'){
    sub='原价 '+money(a.price||0,{cents:false});
    hero='<b>已退役</b>';heroCls=' retired';foot='持有 '+heldText(a);
  }else{
    sub=money(a.price,{cents:false})+' · 已用 '+daysHeld(a)+' 天';
    hero='¥<b>'+dailyCost(a).toFixed(2)+'</b><span class="u">/天</span>';
    foot='剩余 '+serviceLeft(a).toLocaleString('en-US')+' 天';
  }
  const spark=(a.group==='physical'&&(a.status==='active'||a.status==='idle'))
    ?'<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none"><path d="M2 5 C 22 7 26 20 50 22 S 84 24 98 24"/></svg>':'';
  return '<div class="gcell'+faded+'" data-act="asset" data-arg="'+a.id+'" role="button" tabindex="0" aria-label="'+a.name+'，'+STATUS[a.status].label+'">'+
    ph+
    '<div class="ginfo"><div class="gnm">'+a.name+'</div><div class="gsub">'+sub+'</div>'+
      '<div class="gcost'+heroCls+'">'+hero+'</div>'+spark+
      '<div class="gfoot">'+foot+'</div></div></div>';
}

  }else if(isEntitleLike(a)){
    let big='',line='';const m=a.meter;

    else{big=entitleUnit(a);line=entitleSub(a);}
    hero='<div class="dhero'+(a.photo?' has-photo':'')+'">'+heroVisual+'<div class="nm">'+a.name+'</div>'+
      '<div class="dailybig num">'+big+'</div><div class="line">'+line+'</div>'+rulerHTML(a,true)+'</div>';
  }else{ // physical
    if(a.status==='sold'){
      hero='<div class="dhero'+(a.photo?' has-photo':'')+'">'+heroVisual+'<div class="nm">'+a.name+' '+statusPill(a)+'</div>'+
        '<div class="bal num" style="color:var(--sold)">'+money(a.soldPrice)+'</div><div class="line">出售价 · 持有 '+heldText(a)+' · 折旧 '+money(a.soldPrice-a.price,{sign:true})+'</div></div>';
    }else{
      hero='<div class="dhero'+(a.photo?' has-photo':'')+'">'+heroVisual+'<div class="nm">'+a.name+' '+statusPill(a)+'</div>'+
        (a.status==='retired'?'<div class="bal num">'+money(a.price,{cents:false})+'</div><div class="line">原价 · 已退役 · 持有 '+heldText(a)+'</div>':
        '<div class="dailybig num">¥'+dailyCost(a).toFixed(2)+'<span class="u">/天</span></div><div class="line">总价 '+money(a.price,{cents:false})+' · 已持有 '+heldText(a)+'</div>')+'</div>';
    }
  }
  // actions
  let acts='';
  if(S.edit){
    const editType=S.edit.field==='bought'?'date':'text';
    const inputMode=S.edit.field==='bought'?'':' inputmode="decimal"';
    acts='<div class="editbar"><input id="editInput" type="'+editType+'"'+inputMode+' value="'+S.edit.value+'" aria-label="'+S.edit.label+'"/><button class="ok" data-act="edit-ok">确认</button><button class="cancel" data-act="edit-cancel">取消</button></div>';
  }else if(a.group==='cash'){
    acts='<div class="detail-actions"><button class="primary" data-act="edit" data-arg="balance">改余额</button><button data-act="noop">转账记录</button></div>';
  }else if(isEntitleLike(a)){
    const m=a.meter;
    if(m&&m.type==='discrete')acts='<div class="detail-actions"><button class="primary" data-act="use" data-arg="'+a.id+'"'+(m.remaining<=0?' disabled':'')+'>'+(m.remaining<=0?'已用完':'用掉一'+a.unitName)+'</button><button data-act="renew" data-arg="'+a.id+'">续期</button></div>';
    else if(m&&m.type==='cont')acts='<div class="detail-actions"><button class="primary" data-act="edit" data-arg="cont">改余额</button><button data-act="renew" data-arg="'+a.id+'">续期</button></div>';
    else acts='<div class="detail-actions"><button class="primary" data-act="renew" data-arg="'+a.id+'">续期一年</button><button data-act="noop">核对会籍</button></div>';
  }else if(a.status==='retired'){
    acts='<div class="detail-actions"><button class="primary" data-act="sell" data-arg="'+a.id+'">标记已售</button><button data-act="setstatus" data-arg="active">恢复服役</button></div>';
  }else if(a.status==='sold'){
    acts='<div class="detail-actions"><button data-act="noop">查看变现记录</button></div>';
  }else{
    acts='<div class="detail-actions"><button class="primary" data-act="edit" data-arg="value">更新估值</button>'+
      (a.status==='idle'?'<button data-act="setstatus" data-arg="active">恢复服役</button>':'<button data-act="setstatus" data-arg="idle">标记闲置</button>')+
      '<button data-act="edit" data-arg="bought">改购入日</button><button data-act="sell" data-arg="'+a.id+'">标记已售</button><button data-act="setstatus" data-arg="retired">标记退役</button></div>';
  }
  const meta=a.meta.map(r=>'<div class="metarow"><span class="mk">'+r[0]+'</span><span class="mv'+(/[¥0-9]/.test(r[1])?'':' cn')+'">'+r[1]+'</span></div>').join('');
  const evs=a.events.map(e=>{const down=/^[−-]/.test(e.delta),up=/^[+]/.test(e.delta);
    return '<div class="tlrow"><div class="rail"><span class="dot'+(e.kind==='spend'||e.kind==='retire'||e.kind==='sell'?' spent':'')+'"></span><span class="line"></span></div><div class="c"><div class="t1"><span>'+e.title+'</span><span class="delta'+(down?' down':(up?' up':''))+'">'+(e.delta||'')+'</span></div><div class="t2">'+mdLabel(e.date)+(e.sub?' · '+e.sub:'')+'</div></div></div>';}).join('');
  const hasRealPhoto=a.photo&&a.photo.indexOf('data:image/svg')!==0; // 生成占位图(svg) 视为「未设照片」
  const photoRow=(!S.edit&&a.group!=='cash')?
    '<div class="photo-row"><button class="photo-btn" data-act="pickphoto">'+svg('camera')+(hasRealPhoto?'更换照片':'添加照片')+'</button>'+
    '<input type="file" id="assetPhoto" accept="image/*" style="display:none"/></div>':'';
  setScreen(hero+acts+photoRow+
    '<div class="section-label">资产信息</div><div class="block">'+meta+'</div>'+
    '<div class="section-label">变动记录<span class="muted">'+a.events.length+' 条</span></div><div class="block"><div class="timeline">'+evs+'</div></div>'+
    '<div style="height:8px"></div>');
  if(S.edit){const inp=document.getElementById('editInput');if(inp){inp.focus();inp.select();}}
  const pin=document.getElementById('assetPhoto');
  if(pin)pin.addEventListener('change',ev=>{

    rd.onload=async()=>{a.photo=await makeThumb(rd.result);saveAssets();showStamp('已更新照片');viewAssetDetail();};
    rd.readAsDataURL(f);
  });
}

function showStamp(text){const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;const host=document.createElement('div');host.className='stamp-host';const st=document.createElement('div');st.className='stamp';st.textContent=text;if(reduce){st.style.opacity='1';st.style.transform='rotate(-8deg)';}host.appendChild(st);document.getElementById('app').appendChild(host);if(!reduce){requestAnimationFrame(()=>st.classList.add('go'));setTimeout(()=>st.classList.add('out'),700);}setTimeout(()=>host.remove(),reduce?1200:1300);}
function useAsset(id){const a=ASSETS.find(x=>x.id===id);if(!a||!a.meter||a.meter.type!=='discrete'||a.meter.remaining<=0)return;a.meter.remaining-=1;a.value=Math.max(0,a.value-(a.perUnit||0));a.events.unshift({date:TODAY,title:'用掉 1 '+a.unitName,delta:'−1',sub:'剩 '+a.meter.remaining+' '+a.unitName,kind:'use'});saveAssets();showStamp('已核销');setTimeout(()=>{viewAssetDetail();renderTabs();},460);}
function renew(id){const a=ASSETS.find(x=>x.id===id);if(!a)return;if(a.validUntil)a.validUntil=addYears(a.validUntil,1);if(a.meter&&a.meter.type==='time'){a.meter.start=a.meter.end;a.meter.end=addYears(a.meter.end,1);}if(a.meta){a.meta=a.meta.map(r=>/到期|有效期/.test(r[0])?[r[0],a.validUntil||r[1]]:r);}a.events.unshift({date:TODAY,title:'续期一年',delta:'',sub:'有效期延至 '+(a.validUntil||a.meter.end),kind:'in'});saveAssets();showStamp('已续期');setTimeout(()=>{viewAssetDetail();renderTabs();},460);}
function setStatus(st){const a=ASSETS.find(x=>x.id===S.currentAsset);if(!a)return;a.status=st;a.events.unshift({date:TODAY,title:'状态改为「'+STATUS[st].label+'」',delta:'',sub:'',kind:st==='active'?'in':'idle'});saveAssets();showStamp(STATUS[st].label);setTimeout(()=>{viewAssetDetail();renderTabs();},420);}
function sell(id){const a=ASSETS.find(x=>x.id===id);if(!a)return;const guess=Math.round(a.value*0.6);S.edit={field:'sell',label:'出售价',value:String(guess||0)};viewAssetDetail();}
function applyEdit(){const a=ASSETS.find(x=>x.id===S.currentAsset);const inp=document.getElementById('editInput');if(!a||!inp){S.edit=null;viewAssetDetail();return;}const v=parseFloat(inp.value)||0;const f=S.edit.field;
  if(f==='balance'){a.value=v;if(a.meta)a.meta=a.meta.map(r=>/余额/.test(r[0])?[r[0],money(v)]:r);a.events.unshift({date:TODAY,title:'改余额',delta:money(v),sub:'手动核对',kind:'val'});}
  else if(f==='cont'){a.meter.remaining=Math.min(v,a.meter.total);a.value=a.meter.remaining;a.events.unshift({date:TODAY,title:'改余额',delta:money(a.meter.remaining),sub:'',kind:'val'});}
  else if(f==='value'){a.value=v;if(a.meta)a.meta=a.meta.map(r=>/估值/.test(r[0])?[r[0],money(v)]:r);a.events.unshift({date:TODAY,title:'更新估值',delta:money(v),sub:'按行情评估',kind:'val'});}
  else if(f==='bought'){
    const next=(inp.value||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(next)){showStamp('日期格式不对');return;}
    const old=a.bought;
    a.bought=next;
    if(a.meta)a.meta=a.meta.map(r=>r[0]==='购入日'?[r[0],next]:r);
    if(next!==old){
      if(a.events)a.events=a.events.map(e=>(e.kind==='buy'&&(!old||e.date===old))?{...e,date:next}:e);
      a.events.unshift({date:TODAY,title:'修改购入日',delta:'',sub:next,kind:'val'});
    }
  }
  else if(f==='sell'){a.soldPrice=v;a.status='sold';a.value=0;a.events.unshift({date:TODAY,title:'已出售',delta:money(v,{sign:true}),sub:'折旧 '+money(v-(a.price||0),{sign:true}),kind:'sell'});}
  S.edit=null;saveAssets();showStamp('已更新');setTimeout(()=>{viewAssetDetail();renderTabs();},300);}

function loadByok(){try{return JSON.parse(localStorage.getItem('byok_v1')||'{}');}catch(e){return {};}}
function saveByok(o){try{localStorage.setItem('byok_v1',JSON.stringify(o));}catch(e){}}
function byokReady(){const b=loadByok();return !!(b.key&&b.base);}
const BYOK_PRESETS={
  xiaomi:{label:'小米 MiMo',base:'https://token-plan-cn.xiaomimimo.com/v1',model:'mimo-v2.5'},
  kimi:{label:'Kimi（Moonshot）',base:'https://api.moonshot.cn/v1',model:'kimi-latest'},
  custom:{label:'自定义',base:'',model:''},
};
async function llmExtract(text, image){
  const b=loadByok();
  const url=(b.base||'').replace(/\/+$/,'')+'/chat/completions';
  const sys='今天是'+TODAY+'。你是资产录入助手。从用户的一句话或一张图片里抽取"一件资产"，只输出一个 JSON 对象：'+
    '{"name":"物品名（简洁）","category":"数码|家居|交通|权益|会员|现金|其他 之一","price":购入价数字,"est_value":当前估值数字,"bought_date":"YYYY-MM-DD","note":""}。'+
    '把相对日期（上个月/上月/去年X月/前年/今年X月/X月X日）按今天解析为 YYYY-MM-DD。若文字或图片中出现购买/下单日期，务必用它作为 bought_date，否则才用今天。缺失字段给合理默认或空字符串/0。只返回 JSON，不要解释。';
  const userContent = image ? [{type:'text',text:text||'识别图片里的这件资产'},{type:'image_url',image_url:{url:image}}] : text;
  const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+(b.key||'')},
    body:JSON.stringify({model:b.model||'kimi-latest',temperature:0.2,response_format:{type:'json_object'},
      messages:[{role:'system',content:sys},{role:'user',content:userContent}]})});
  if(!res.ok){let t='';try{t=await res.text();}catch(e){}throw new Error('HTTP '+res.status+(t?' '+t.slice(0,100):''));}
  const data=await res.json();
  let c=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
  let obj=null;try{obj=JSON.parse(c);}catch(e){const m=c.match(/\{[\s\S]*\}/);if(m)try{obj=JSON.parse(m[0]);}catch(_){}}
  if(!obj)throw new Error('未返回有效 JSON');
  return {name:obj.name,category:obj.category,price:+obj.price||0,est_value:+obj.est_value||0,bought_date:obj.bought_date,note:obj.note,_src:image?'AI · 图片':'AI'};
}
function localExtract(text){
  let price=0;const pm=text.match(/¥\s*([\d,]+(?:\.\d+)?)/)||text.match(/([\d,]+(?:\.\d+)?)\s*(?:块|元|rmb|RMB)/)||text.match(/([\d,]{3,}(?:\.\d+)?)/);
  if(pm)price=parseFloat(pm[1].replace(/,/g,''))||0;
  const [Y,M]=TODAY.split('-').map(Number);let d=TODAY;let m;
  if(/前年/.test(text))d=(Y-2)+'-01-01';
  else if((m=text.match(/去年\s*(\d{1,2})\s*月/)))d=(Y-1)+'-'+String(+m[1]).padStart(2,'0')+'-01';
  else if(/去年/.test(text))d=(Y-1)+'-06-01';
  else if((m=text.match(/今年\s*(\d{1,2})\s*月/)))d=Y+'-'+String(+m[1]).padStart(2,'0')+'-01';
  else if(/上(?:个)?月/.test(text)){let mm=M-1,yy=Y;if(mm<1){mm=12;yy--;}d=yy+'-'+String(mm).padStart(2,'0')+'-15';}
  else if((m=text.match(/(\d{4})\s*[-./年]\s*(\d{1,2})/)))d=m[1]+'-'+String(+m[2]).padStart(2,'0')+'-01';
  else if((m=text.match(/(\d{1,2})\s*月/)))d=Y+'-'+String(+m[1]).padStart(2,'0')+'-01';
  const kw=[['交通',/汽车|电动车|自行车|摩托|思域|特斯拉|比亚迪|byd|小米su7|车\b/i],['数码',/手机|iphone|安卓|电脑|笔记本|mac|平板|ipad|相机|镜头|耳机|switch|显示器|键盘|路由|手环|手表|腕表|耳麦|gpu|显卡/i],['家居',/沙发|餐桌|椅|床|冰箱|空调|洗衣机|吸尘器|戴森|家具|厨|扫地机|按摩椅/],['会员',/会员|订阅|年卡|月卡|plus|vip/i],['权益',/航段|机票|礼品卡|票|券|储值|积分|里程/],['现金',/银行卡|储蓄|余额宝?|现金|存款|账户|钱包/]];
  let category='其他';for(const [c,re] of kw){if(re.test(text)){category=c;break;}}
  let name=text.replace(/¥\s*[\d,]+(?:\.\d+)?/g,'').replace(/[\d,]+(?:\.\d+)?\s*(?:块|元|rmb|RMB)/g,'')
    .replace(/前年|去年|今年|上(?:个)?月|\d{4}\s*[-./年]\s*\d{1,2}(?:\s*[-./月]\s*\d{1,2})?|\d{1,2}\s*月(?:\s*\d{1,2}\s*日?)?/g,'')
    .replace(/(?:^|\s)[\d,]{3,}(?:\.\d+)?(?=\s|$)/g,' ')
    .replace(/买的?了?|花了?|入手|购入|大概|差不多|我|的|一[台个块只支]/g,'').replace(/\s+/g,' ').trim();
  if(!name)name='新资产';if([...name].length>16)name=[...name].slice(0,16).join('');
  return {name,category,price,est_value:price?Math.round(price*0.75):0,bought_date:d,_src:'本地'};
}
async function runNL(text, image){
  let r;
  try{
    if(image){ if(!byokReady())throw new Error('传图识别需先接入 AI'); r=await llmExtract(text, image); }
    else { r=byokReady()?await llmExtract(text):localExtract(text); }
    S.nl={text,image,loading:false,result:r,error:null};
  }catch(e){
    if(image){ S.nl={text,image,loading:false,result:null,error:'图片识别失败：'+(e.message||e)}; }
    else { r=localExtract(text); S.nl={text,image,loading:false,result:r,error:'AI 解析失败（'+(e.message||e)+'），已用本地解析兜底'}; }
  }
  if(S.screen==='action')viewAction();
}

function addAssetFromNL(r){
  const cm={'数码':{group:'physical',icon:'box',tint:'#E1E6EC'},'家居':{group:'physical',icon:'box',tint:'#E9E4DA'},'交通':{group:'physical',icon:'car',tint:'#DBE8DF'},'权益':{group:'entitle',icon:'ticket',tint:'#DBE8DF'},'会员':{group:'member',icon:'member',tint:'#E4E8DC'},'现金':{group:'cash',icon:'cash',tint:'#DDE7EC'},'其他':{group:'physical',icon:'box',tint:'#E7E9E4'}};
  const c=cm[r.category]||cm['其他'];
  const price=Math.round((r.price||0)*100)/100, value=Math.round((r.est_value||r.price||0)*100)/100;
  const id='nl'+(nlSeq++);
  const a={id,group:c.group,cat:r.category||'其他',name:r.name||'新资产',icon:c.icon,tint:c.tint,status:'active',countable:true,value,
    meta:[],events:[{date:r.bought_date||TODAY,title:'录入资产',delta:price?'−'+money(price):'',sub:r._src||'手动录入',kind:'buy'}]};
  if(S.nl&&S.nl.image)a.photo=S.nl.image;
  if(c.group==='physical'){a.price=price;a.bought=r.bought_date||TODAY;a.meta=[['购入价',price?money(price):'—'],['购入日',a.bought],['当前估值',money(value)],['录入方式',r._src||'手动']];}
  else if(c.group==='cash'){a.value=value;a.meta=[['账户',a.name],['当前余额',money(value)]];}
  else {a.value=value;a.meta=[['当前价值',money(value)],['录入方式',r._src||'手动']];}
  ASSETS.unshift(a);
  S.nl=null;S.currentAsset=id;saveAssets();showStamp('已添加');setTimeout(()=>route('asset-detail'),440);
}

document.getElementById('app').addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,arg=t.dataset.arg;
  if(act==='nav')route(arg);
  else if(act==='group'){S.cat=({financial:'现金',physical:'数码',entitle:'权益',member:'会员'})[arg]||'全部';S.status='全部';route('assets');}
  else if(act==='cat'){S.cat=arg;const l=document.getElementById('itemList');if(l)l.innerHTML=itemsHTML();document.querySelectorAll('.cat-tab').forEach(x=>x.classList.toggle('on',x.dataset.arg===arg));}
  else if(act==='status'){S.status=arg;const l=document.getElementById('itemList');if(l)l.innerHTML=itemsHTML();document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.arg===arg));}
  else if(act==='viewmode'){S.viewMode=arg;const l=document.getElementById('itemList');if(l)l.innerHTML=itemsHTML();document.querySelectorAll('.view-toggle button').forEach(x=>x.classList.toggle('on',x.dataset.arg===arg));}
  else if(act==='asset'){S.currentAsset=arg;S.edit=null;route('asset-detail');}
  else if(act==='use')useAsset(arg);
  else if(act==='renew')renew(arg);
  else if(act==='sell')sell(arg);
  else if(act==='setstatus')setStatus(arg);
  else if(act==='edit'){const a=ASSETS.find(x=>x.id===S.currentAsset);S.edit={field:arg,label:arg==='value'?'当前估值':(arg==='bought'?'购入日':'当前余额'),value:String(arg==='cont'?a.meter.remaining:(arg==='bought'?(a.bought||TODAY):a.value))};viewAssetDetail();}
  else if(act==='edit-ok')applyEdit();
  else if(act==='edit-cancel'){S.edit=null;viewAssetDetail();}
  else if(act==='valmode'){S.valueMode=S.valueMode==='all'?'cashOnly':'all';viewOverview();}
  else if(act==='ovmode'){S.ovMode=arg;viewOverview();}
  else if(act==='valset'){S.valueMode=arg;viewMe();}
  else if(act==='addtmpl')showStamp('演示：已添加');
  else if(act==='nl-go'){const inp=document.getElementById('nlInput');const text=inp?inp.value.trim():'';const img=S.nl&&S.nl.image;if(!text&&!img){showStamp('写一句话或传张图');return;}S.nl={text,image:img,loading:true,result:null,error:null};viewAction();runNL(text,img);}
  else if(act==='nl-pickimg'){if(!byokReady()){showStamp('传图识别需先接入 AI');return;}const i=document.getElementById('nlImg');if(i)i.click();}
  else if(act==='nl-confirm'){if(S.nl&&S.nl.result)addAssetFromNL(S.nl.result);}
  else if(act==='nl-reset'){S.nl=null;viewAction();}
  else if(act==='byok-preset'){const p=BYOK_PRESETS[arg]||BYOK_PRESETS.kimi;const cur=loadByok();saveByok({provider:arg,base:p.base||cur.base||'',model:p.model||cur.model||'',key:cur.key||''});viewByok();}
  else if(act==='byok-save'){const base=(document.getElementById('byokBase').value||'').trim();const key=(document.getElementById('byokKey').value||'').trim();const model=(document.getElementById('byokModel').value||'').trim()||'kimi-latest';const cur=loadByok();saveByok({provider:cur.provider||'kimi',base,key,model});showStamp(key&&base?'已启用 AI':'已保存');setTimeout(()=>route('me'),440);}
  else if(act==='byok-clear'){saveByok({});showStamp('已清除');viewByok();}
  else if(act==='reset-data'){if(confirm('确定要恢复初始化资产数据吗？这会覆盖本机当前修改。')){ASSETS=cloneAssets(DEFAULT_ASSETS);dbPutAll(ASSETS);ensureThumbs();showStamp('已恢复');setTimeout(()=>route('overview'),400);}}
  else if(act==='pickphoto'){const i=document.getElementById('assetPhoto');if(i)i.click();}
  else if(act==='noop')showStamp('演示中暂未开放');
});
document.getElementById('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='editInput'){e.preventDefault();applyEdit();return;}if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target.closest('[data-act][tabindex]');if(!t)return;e.preventDefault();t.click();});

/* --- 持久化：所有修改 ASSETS 的地方都调用 saveAssets --- */
function saveAssets(){debouncedSave();}

/* --- boot：从 IndexedDB 加载，首次用默认数据 --- */
(async function boot(){
  const h=(location.hash||'').replace('#','');
  if(h&&VIEWS[h])S.screen=h;
  try{
    const saved=await dbGetAll();
    if(saved&&saved.length){ASSETS=saved;}else{ASSETS=cloneAssets(DEFAULT_ASSETS);await dbPutAll(ASSETS);}
  }catch(e){console.warn('[boot] IndexedDB load failed, using defaults',e);ASSETS=cloneAssets(DEFAULT_ASSETS);}
  ensureThumbs();
  /* 注册 Service Worker */
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  route(S.screen);
})();
</script>
